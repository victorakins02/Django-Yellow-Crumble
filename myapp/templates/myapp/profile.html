{% extends "myapp/base.html" %}

{% block content %}
<div class="inner-wrapper" style="max-width: 500px; margin: 4rem auto; padding: 2rem; border: 1px solid #eee; border-radius: 8px;">
    <h2 style="font-family: 'Pacifico', cursive; color: #d4a017;">Your Profile</h2>
    <p>Logged in as: <strong>{{ user.username }}</strong></p>
    <hr style="margin: 1.5rem 0; border: 0.5px solid #eee;">

    <form method="POST">
        {% csrf_token %}
        <!-- Profile Form Fields -->
        {% for field in form %}
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">{{ field.label }}</label>
                {{ field }}
                <!-- If field has errors, display them -->
                {% if field.errors %}
                    <p style="color: red; font-size: 0.8rem;">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" style="background: #d4a017; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; width: 100%;">
            Save Profile Info
        </button>
    </form>
</div>
{% endblock %}
