{% extends 'myapp/base.html' %} 
{% load static %}

{% block title %}
    Edit Review | Yellow Crumble
{% endblock %}

{% block extra_styles %}
  <link rel="stylesheet" href="{% static 'myapp/Styles/review.css' %}">
  <link rel="stylesheet" href="{% static 'myapp/Styles/home_style.css' %}">
{% endblock %}


{% block content %}
<section class="section">
    <div class="review-form-card" style="max-width: 600px; margin: 50px auto;">
        <h2 class="section-title">Edit Your Review</h2>
        <p class="section-desc">Change your mind? Update your feedback below.</p>

        <!-- Review Edit Form -->
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Your Name</label>
                <input type="text" name="customer_name" value="{{ review.customer_name }}" required class="form-control">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label>Rating (1-5)</label>
                <input type="number" name="rating" min="1" max="5" value="{{ review.rating }}" required class="form-control">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label>Comment</label>
                <textarea name="comment" required class="form-control" rows="5">{{ review.comment }}</textarea>
            </div>

            <div style="display: flex; gap: 10px;">
                <button type="submit" class="primary-btn">Save Changes</button>
                <a href="{% url 'review' %}" class="secondary-btn" style="text-decoration: none; line-height: 40px;">Cancel</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
